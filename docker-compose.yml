services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    mem_limit: 1g
    # loopback-only: unauthenticated qdrant must never face the internet;
    # the api container reaches it over the docker network (http://qdrant:6333)
    # and host cron uses localhost — both unaffected.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    # Optional API-key auth (off by default): uncomment both lines here and
    # QDRANT_API_KEY on the api service below, with the SAME secret.
    # environment:
    #   QDRANT__SERVICE__API_KEY: change-me-long-random
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # RocksDB needs far more than the 1024 default; below it the server
    # exhausts fds mid-suite ("Too many open files") and dies.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  api:
    build: .
    mem_limit: 1500m
    ports:
      # host 18080 (8080 is taken on this dev box); nginx terminates TLS in prod
      - "18080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      FRESHNESS_MAX_HOURS: "72"
      # set together with QDRANT__SERVICE__API_KEY on the qdrant service
      # QDRANT_API_KEY: change-me-long-random
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      # NFR-5: cookies are live credentials — read-only bind mount, never COPY'd.
      # To enable Mode A scraping inside the container, uncomment:
      # - ./www.youtube.com_cookies.txt:/cookies/www.youtube.com_cookies.txt:ro
    depends_on:
      - qdrant
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
