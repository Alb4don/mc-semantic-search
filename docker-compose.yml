services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    mem_limit: 1g
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
    restart: unless-stopped

  api:
    build: .
    mem_limit: 1500m
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      FRESHNESS_MAX_HOURS: "72"
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      # NFR-5: cookies are live credentials — read-only bind mount, never COPY'd.
      # To enable Mode A scraping inside the container, uncomment:
      # - ./www.youtube.com_cookies.txt:/cookies/www.youtube.com_cookies.txt:ro
    depends_on:
      - qdrant
    restart: unless-stopped
